name: Real app

# Drives the real Tauri app (real window, real files, real settings store, real restarts) on Linux
# under a virtual display. Run on demand or weekly, not on every push: it compiles the Rust shell.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  real-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev xvfb xdotool webkit2gtk-driver locales
          sudo locale-gen fr_FR.UTF-8
      - run: cargo install tauri-driver --locked
      - run: npm ci
      - run: cargo build --manifest-path src-tauri/Cargo.toml
      - run: npm run test:real
